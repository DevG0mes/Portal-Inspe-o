name: portal-production

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

x-environment: &environment
  NODE_ENV: production
  APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
  DATABASE_URL: ${DATABASE_URL:?Set internal DATABASE_URL}
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: '9000'
  MINIO_USE_SSL: 'false'
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?Set HTTPS MINIO_PUBLIC_URL}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-inspection-evidence}

services:
  postgres:
    <<: *runtime
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    # Official entrypoint initializes ownership and then drops to postgres.
    read_only: false
    cap_drop: []
    security_opt: []
  redis:
    <<: *runtime
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    user: redis
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    <<: *runtime
    image: portal-inspecao/minio:7aac2a2-local
    build: { context: ./minio }
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, curl, -f, 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    image: portal/api:${RELEASE_TAG:?Set RELEASE_TAG}
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment: *environment
    command: [node, dist/database/migrate.js]
    user: node
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *runtime
    image: portal/api:${RELEASE_TAG:?Set RELEASE_TAG}
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment:
      <<: *environment
      API_HOST: 0.0.0.0
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
  worker:
    <<: *runtime
    image: portal/worker:${RELEASE_TAG:?Set RELEASE_TAG}
    build: { context: .., dockerfile: infra/Dockerfile.worker }
    environment: *environment
    depends_on:
      api: { condition: service_healthy }
  web:
    <<: *runtime
    image: portal/web:${RELEASE_TAG:?Set RELEASE_TAG}
    build: { context: .., dockerfile: infra/Dockerfile.web }
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set HTTPS APP_ORIGIN}
      API_INTERNAL_URL: http://api:3001
    tmpfs:
      [
        '/tmp:rw,noexec,nosuid,size=128m',
        '/app/apps/web/.next/cache:rw,nosuid,size=64m,uid=1000,gid=1000',
      ]
    depends_on:
      api: { condition: service_healthy }
  ingress:
    <<: *runtime
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    environment:
      PORTAL_HOST: ${PORTAL_HOST:?Set PORTAL_HOST}
      FILES_HOST: ${FILES_HOST:?Set FILES_HOST}
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp/conf.d
    # Config generated into tmpfs; nginx main config includes this directory.
    command:
      [
        /bin/sh,
        -c,
        "envsubst '$$PORTAL_HOST $$FILES_HOST' < /etc/nginx/templates/portal.template > /tmp/portal.conf && printf 'pid /tmp/nginx.pid; events {} http { include /etc/nginx/mime.types; include /tmp/portal.conf; }' > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'",
      ]
    ports: ['${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:8443']
    volumes:
      - ./nginx.conf:/etc/nginx/templates/portal.template:ro
      - ${TLS_DIRECTORY:?Set TLS_DIRECTORY}:/etc/portal-tls:ro
    healthcheck:
      test: [CMD-SHELL, 'wget --no-check-certificate -qO- https://127.0.0.1:8443/ingress-health']
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      web: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
