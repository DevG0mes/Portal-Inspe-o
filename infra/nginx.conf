# Both DNS names must resolve to this host. Certificate SAN covers both names.
# Only this ingress publishes a port. Never trust client-supplied forwarding headers.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
log_format portal escape=json '{"event":"ingress.completed","requestId":"$upstream_http_x_request_id","ingressId":"$request_id","status":$status,"duration":"$request_time"}';
access_log /dev/stdout portal;
error_log /dev/stderr crit;
client_body_temp_path /tmp/client_temp;
proxy_temp_path /tmp/proxy_temp;
fastcgi_temp_path /tmp/fastcgi_temp;
uwsgi_temp_path /tmp/uwsgi_temp;
scgi_temp_path /tmp/scgi_temp;
server_tokens off;
client_max_body_size 25m;
client_body_timeout 30s;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_certificate /etc/portal-tls/fullchain.pem;
ssl_certificate_key /etc/portal-tls/privkey.pem;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

server {
  listen 8443 ssl default_server;
  server_name _;
  location = /ingress-health { access_log off; return 200 'ok'; }
  location / { return 444; }
}
server {
  listen 8443 ssl;
  server_name ${PORTAL_HOST};
  location ~* ^/api/auth/(login|change-password)/?$ {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://web:3000;
  }
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://web:3000;
  }
}
server {
  listen 8443 ssl;
  server_name ${FILES_HOST};
  # Only signed object reads. No console, bucket administration, listing or upload at ingress.
  location ~ ^/[^/]+/.+ {
    limit_except GET { deny all; }
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_pass http://minio:9000;
  }
  location / { return 403; }
}
